# Additional Nginx configuration for enhanced security
# Add this to your main nginx.conf or site-specific configuration

# Disable autoindex globally
autoindex off;

# Block access to internal directories
location ~ ^/(views|vendor|storage|node_modules|config|backups)/ {
    deny all;
    return 404;
}

# Block access to sensitive file extensions
location ~ \.(env|config|log|sql|bak|backup|twig|tpl)$ {
    deny all;
    return 404;
}

# Block URLs containing template variables
location ~ \{\{.*\}\} {
    add_header X-Robots-Tag "noindex, nofollow" always;
    deny all;
    return 404;
}

# Block URL-encoded template variables
location ~ %7B%7B.*%7D%7D {
    add_header X-Robots-Tag "noindex, nofollow" always;
    deny all;
    return 404;
}

# Add security headers for sensitive paths
location ~ ^/(auth|login|register|profile|tickets|account|admin|consultation) {
    add_header X-Robots-Tag "noindex, nofollow" always;
    # Continue to serve the content normally
    try_files $uri $uri/ =404;
}

# Security headers for all requests
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

# Content Security Policy
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.google.com https://www.gstatic.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.whatsapp.com; frame-ancestors 'none';" always;

# HSTS Header
add_header Strict-Transport-Security "max-age=15552000; includeSubDomains; preload" always;

# Rate limiting for POST requests (requires nginx rate limiting module)
limit_req_zone $binary_remote_addr zone=forms:10m rate=10r/m;
location ~ \.(php|aspx|jsp)$ {
    limit_req zone=forms burst=5 nodelay;
}

# Block common attack patterns
location ~ /(wp-admin|wp-login|admin|administrator|phpmyadmin|sqlbuddy) {
    deny all;
    return 404;
}

# Hide server information
server_tokens off;