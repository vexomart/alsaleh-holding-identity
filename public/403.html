<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - وصول مرفوض | علي الشهري القابضة</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://alialshehriholding.com/403">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #7c2d12 0%, #ea580c 50%, #f59e0b 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            direction: rtl;
        }
        .container {
            max-width: 600px;
            padding: 2rem;
        }
        .error-code {
            font-size: 8rem;
            font-weight: bold;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .title {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        .description {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            opacity: 0.9;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 2px solid rgba(255,255,255,0.3);
            margin: 0 10px;
        }
        .btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 2rem;
            opacity: 0.8;
        }
        @media (max-width: 768px) {
            .error-code {
                font-size: 5rem;
            }
            .title {
                font-size: 1.5rem;
            }
            .container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">علي الشهري القابضة</div>
        <div class="error-code">403</div>
        <h1 class="title">وصول مرفوض</h1>
        <p class="description">
            عذراً، ليس لديك صلاحية للوصول إلى هذه الصفحة.
            <br>
            يرجى التواصل مع المدير إذا كنت تعتقد أن هذا خطأ.
        </p>
        <a href="/" class="btn">العودة للرئيسية</a>
        <a href="/contact" class="btn">تواصل معنا</a>
    </div>
</body>
</html>
