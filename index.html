    <div id="root">
      <!-- Critical loading indicator for immediate FCP -->

    <!-- Optimized script loading for faster execution -->
    <script type="module">
      // Remove loader once React takes over
      const loader = document.getElementById('initial-loader');
      const observer = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => {
          if (mutation.addedNodes.length > 0) {
            loader?.remove();
            observer.disconnect();
          }
        });
      });
      observer.observe(document.getElementById('root'), { childList: true });
      
      // Timeout fallback to remove loader
      setTimeout(() => {
        loader?.remove();
      }, 3000);
    </script>
