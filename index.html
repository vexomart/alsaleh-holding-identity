    <!-- Arabic Fonts - Async Loading with font-display swap -->
    <script>
      // Async font loading for better performance
      function loadFonts() {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&display=swap&subset=arabic';
        document.head.appendChild(link);
      }
      // Load fonts after DOM is ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadFonts);
      } else {
        loadFonts();
      }
    </script>
