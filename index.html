    <!-- Non-Critical Fonts - Async Loading -->
    <script>
      // Load remaining font weights asynchronously
      function loadRemainingFonts() {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;700&display=swap&subset=arabic';
        document.head.appendChild(link);
      }
      
      // Load after critical rendering
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
          requestIdleCallback ? requestIdleCallback(loadRemainingFonts) : setTimeout(loadRemainingFonts, 0);
        });
      } else {
        requestIdleCallback ? requestIdleCallback(loadRemainingFonts) : setTimeout(loadRemainingFonts, 0);
      }
    </script>
