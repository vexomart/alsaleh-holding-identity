    <!-- Critical inline styles for immediate FCP -->
    <style>
      /* Critical font stack with system fallbacks for instant text render */
      * {
        font-family: 'Cairo', system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      }
      
      /* Critical reset for immediate layout */
      html, body {
        margin: 0;
        padding: 0;
        background-color: #ffffff;
        color: #1f2937;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* Prevent layout shift with size-adjust for fallbacks */
      @font-face {
        font-family: 'Cairo-fallback';
        font-style: normal;
        font-weight: 400;
        src: local('system-ui'), local('-apple-system'), local('Segoe UI');
        size-adjust: 103%;
        ascent-override: 98%;
        descent-override: 25%;
        line-gap-override: 0%;
      }
      
      /* Optimized Cairo font faces for FCP */
      @font-face {
        font-family: 'Cairo';
        font-style: normal;
        font-weight: 400;
        font-display: swap;

        unicode-range: U+0600-06FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE80-FEFC;
      }
      @font-face {
        font-family: 'Cairo';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url(https://fonts.gstatic.com/s/cairo/v30/SLXVc1nY6HkvangtZmpQdkhzfH5lkSscQyyS8p4_RHH1.woff2) format('woff2');
        unicode-range: U+0600-06FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE80-FEFC;
      }
      
      /* Loading state optimization */
      #root {
        min-height: 100vh;
      }
      
      /* Critical spinner for immediate visual feedback */
      .app-loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 40px;
        height: 40px;
        border: 3px solid #f3f4f6;
        border-top: 3px solid #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: translate(-50%, -50%) rotate(0deg); }
        100% { transform: translate(-50%, -50%) rotate(360deg); }
      }
    </style>
    
    <!-- Highly optimized non-critical font loading -->
    <script>
      // Streamlined font loading for better FCP
      function loadAdditionalFonts() {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;700&display=swap&subset=arabic';
        link.media = 'print';
        link.onload = function() { this.media = 'all'; };
        document.head.appendChild(link);
      }
      
      // More aggressive deferral for FCP optimization
      if ('requestIdleCallback' in window) {
        requestIdleCallback(loadAdditionalFonts, { timeout: 1000 });
      } else {
        setTimeout(loadAdditionalFonts, 500);
      }
    </script>
    
    <!-- Fallback for no-script -->
    <noscript><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&display=swap&subset=arabic" rel="stylesheet"></noscript>

  <body>
    <div id="root">
      <!-- Critical loading indicator for immediate FCP -->
      <div class="app-loading" id="initial-loader"></div>
    </div>
    
    <!-- Optimized script loading for faster execution -->
    <script type="module">
      // Remove loader once React takes over
      const loader = document.getElementById('initial-loader');
      const observer = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => {
          if (mutation.addedNodes.length > 0) {
            loader?.remove();
            observer.disconnect();
          }
        });
      });
      observer.observe(document.getElementById('root'), { childList: true });
      
      // Timeout fallback to remove loader
      setTimeout(() => {
        loader?.remove();
      }, 3000);
    </script>
    
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(function(registration) {
              console.log('SW registered: ', registration);
            })
            .catch(function(registrationError) {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
